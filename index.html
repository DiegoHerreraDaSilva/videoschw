<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="1800">
<title>TV Schwaben</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
</style>
</head>
<body>
<video id="v" src="video.mp4" autoplay muted loop playsinline webkit-playsinline></video>

<script>
  // Compatível com navegadores antigos de Smart TV (sem const, arrow function ou async)
  var v = document.getElementById("v");

  function tocar() {
    try { var p = v.play(); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
  }

  v.addEventListener("ended", function () { v.currentTime = 0; tocar(); }, false);
  v.addEventListener("error", function () { setTimeout(function () { location.reload(); }, 5000); }, false);
  v.addEventListener("stalled", function () { setTimeout(tocar, 3000); }, false);

  function telaCheia() {
    var d = document.documentElement;
    var f = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
    if (f) { try { f.call(d); } catch (e) {} }
  }
  document.addEventListener("click", telaCheia, false);
  document.addEventListener("keydown", telaCheia, false);

  tocar();
</script>
</body>
</html>
